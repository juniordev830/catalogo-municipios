name: Validar PHP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analisar sintaxe e testar
        run: docker run --rm -v "$PWD:/work" -w /work php:8.3-cli@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10 sh -c 'php -l main.php && php -l catalog.php && php -l src/Catalog.php && php -l tests/test_catalog.php && php main.php --self-test && php tests/test_catalog.php'
